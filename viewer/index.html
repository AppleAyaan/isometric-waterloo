<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Isometric Waterloo</title>
  <meta name="description" content="A giant isometric map of the University of Waterloo. Every building is real: point at one to see what it is.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #1d2433; --panel: #10151fe6; --ink: #f3efe6; --muted: #a9b0bf; --gold: #fed34c; --line: #ffffff22; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
    #map { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #hl { position: fixed; inset: 0; pointer-events: none; }
    .chip { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
    #title { top: 16px; left: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); width: 300px; }
    #title h1 { margin: 0; font: 18px Silkscreen, monospace; letter-spacing: .5px; color: var(--gold); }
    #title p { margin: 0; color: var(--muted); font-size: 12px; }
    #search { width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: #0006; color: var(--ink); font: inherit; }
    #results { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow: auto; }
    #results li { padding: 5px 8px; border-radius: 6px; cursor: pointer; }
    #results li:hover, #results li.active { background: #ffffff14; }
    #results b { color: var(--gold); font-weight: 600; margin-right: 6px; }
    #tip { position: fixed; pointer-events: none; padding: 5px 9px; font-size: 13px; display: none; white-space: nowrap; z-index: 5; }
    #tip b { color: var(--gold); margin-right: 5px; }
    #card { right: 16px; bottom: 40px; width: 300px; max-width: calc(100vw - 32px); padding: 14px 16px; display: none; }
    #card h2 { margin: 0 0 2px; font-size: 16px; }
    #card .ref { font: 13px Silkscreen, monospace; color: var(--gold); }
    #card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0 0; font-size: 13px; }
    #card dt { color: var(--muted); }
    #card dd { margin: 0; }
    #card a { color: var(--gold); }
    #card .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
    #toggle { top: 16px; right: 16px; padding: 6px 10px; color: var(--ink); font: inherit; cursor: pointer; display: none; }
    #credit { right: 16px; bottom: 10px; padding: 2px 8px; font-size: 11px; color: var(--muted); border-radius: 6px; }
    #credit a { color: var(--muted); }
    @media (max-width: 600px) { #card { left: 16px; right: 16px; width: auto; } #title { width: auto; right: 16px; } }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="hl"></canvas>
  <div id="title" class="chip">
    <h1>Isometric Waterloo</h1>
    <p>Every building is real. Point at one to see what it is.</p>
    <input id="search" placeholder="Find a building (e.g. DC, MC, SLC)…" autocomplete="off">
    <ul id="results"></ul>
  </div>
  <button id="toggle" class="chip">Show whitebox</button>
  <div id="tip" class="chip"></div>
  <div id="card" class="chip"><button class="x" aria-label="Close">×</button><div id="cardBody"></div></div>
  <div id="credit" class="chip">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
  <script>
  (async () => {
    const OUT = new URL('../out/', location.href).href;
    const exists = async (u) => { try { return (await fetch(u, { method: 'HEAD' })).ok; } catch { return false; } };
    const meta = await (await fetch(OUT + 'meta.json')).json();
    const painted = await exists(OUT + 'map.png');
    const sources = { painted: OUT + 'map.png', whitebox: OUT + 'render.png' };
    let mode = painted ? 'painted' : 'whitebox';

    const viewer = OpenSeadragon({
      element: document.getElementById('map'),
      tileSources: { type: 'image', url: sources[mode] },
      showNavigationControl: false, imageSmoothingEnabled: false,
      maxZoomPixelRatio: 6, visibilityRatio: 0.6, constrainDuringPan: true,
      gestureSettingsMouse: { clickToZoom: false },
      animationTime: 0.6, springStiffness: 9,
    });
    window.viewer = viewer;
    viewer.addHandler("open-failed", (e) => console.error("open failed", e.message));
    document.body.style.background = meta.background;

    const toggle = document.getElementById('toggle');
    if (painted) {
      toggle.style.display = 'block';
      toggle.onclick = () => {
        mode = mode === 'painted' ? 'whitebox' : 'painted';
        toggle.textContent = mode === 'painted' ? 'Show whitebox' : 'Show painted';
        const b = viewer.viewport.getBounds();
        viewer.open({ type: 'image', url: sources[mode] });
        viewer.addOnceHandler('open', () => viewer.viewport.fitBounds(b, true));
      };
    }

    // ---- building lookup via the ID map ----
    const byId = new Map(meta.buildings.map((b) => [b.id, b]));
    const idImg = new Image();
    idImg.src = OUT + 'idmap.png';
    await idImg.decode();
    const idc = document.createElement('canvas');
    idc.width = idImg.width; idc.height = idImg.height;
    const ictx = idc.getContext('2d', { willReadFrequently: true });
    ictx.drawImage(idImg, 0, 0);
    const idData = ictx.getImageData(0, 0, idc.width, idc.height).data;
    const D = meta.idDownsample;
    function buildingAt(ix, iy) {
      const x = Math.floor(ix / D), y = Math.floor(iy / D);
      if (x < 0 || y < 0 || x >= idc.width || y >= idc.height) return null;
      const i = (y * idc.width + x) * 4;
      if (idData[i + 2] < 128) return null;
      return byId.get(idData[i] + idData[i + 1] * 256) || null;
    }

    // ---- highlight overlay ----
    const hl = document.getElementById('hl');
    const hctx = hl.getContext('2d');
    let hover = null, selected = null;
    function draw() {
      const dpr = devicePixelRatio || 1;
      if (hl.width !== innerWidth * dpr || hl.height !== innerHeight * dpr) { hl.width = innerWidth * dpr; hl.height = innerHeight * dpr; }
      hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      hctx.clearRect(0, 0, innerWidth, innerHeight);
      const item = viewer.world.getItemAt(0);
      if (!item) return;
      for (const [b, style] of [[selected, '#fed34c'], [hover !== selected ? hover : null, '#ffffffcc']]) {
        if (!b) continue;
        hctx.beginPath();
        for (const poly of b.outlines) poly.forEach(([x, y], i) => {
          const p = item.imageToViewerElementCoordinates(new OpenSeadragon.Point(x, y));
          i ? hctx.lineTo(p.x, p.y) : hctx.moveTo(p.x, p.y);
        }), hctx.closePath();
        hctx.lineWidth = 2; hctx.strokeStyle = style; hctx.fillStyle = style.slice(0, 7) + '22';
        hctx.fill(); hctx.stroke();
      }
    }
    viewer.addHandler('animation', draw);
    viewer.addHandler('update-viewport', draw);
    addEventListener('resize', draw);

    const label = (b) => (b.ref ? `<b>${esc(b.ref)}</b>` : '') + esc(b.name || prettyKind(b.kind));
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const prettyKind = (k) => ({ yes: 'Building', university: 'University building', dormitory: 'Residence', apartments: 'Apartments', house: 'House', retail: 'Shop', part: 'Building' }[k] || (k ? k[0].toUpperCase() + k.slice(1).replace(/_/g, ' ') : 'Building'));

    const tip = document.getElementById('tip');
    new OpenSeadragon.MouseTracker({
      element: viewer.canvas,
      moveHandler: (e) => {
        const item = viewer.world.getItemAt(0);
        if (!item) return;
        const ip = item.viewerElementToImageCoordinates(e.position);
        const b = buildingAt(ip.x, ip.y);
        if (b !== hover) { hover = b; draw(); }
        viewer.canvas.style.cursor = b ? 'pointer' : '';
        if (b && e.pointerType === 'mouse') {
          tip.innerHTML = label(b);
          tip.style.display = 'block';
          tip.style.left = Math.min(e.originalEvent.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
          tip.style.top = e.originalEvent.clientY + 14 + 'px';
        } else tip.style.display = 'none';
      },
      leaveHandler: () => { hover = null; tip.style.display = 'none'; draw(); },
    });
    viewer.addHandler('canvas-click', (e) => {
      if (!e.quick) return;
      const item = viewer.world.getItemAt(0);
      const ip = item.viewerElementToImageCoordinates(e.position);
      select(buildingAt(ip.x, ip.y), false);
    });

    const card = document.getElementById('card');
    card.querySelector('.x').onclick = () => select(null);
    function select(b, fly) {
      selected = b;
      draw();
      if (!b) { card.style.display = 'none'; return; }
      const rows = [
        ['Type', prettyKind(b.kind)],
        b.levels ? ['Storeys', b.levels] : null,
        ['Height', `~${Math.round(b.height)} m`],
        b.address ? ['Address', esc(b.address)] : null,
        b.operator ? ['Operator', esc(b.operator)] : null,
        b.osm ? ['Source', `<a href="https://www.openstreetmap.org/${b.osm}" target="_blank" rel="noopener">OpenStreetMap</a>`] : null,
      ].filter(Boolean);
      document.getElementById('cardBody').innerHTML =
        (b.ref ? `<div class="ref">${esc(b.ref)}</div>` : '') + `<h2>${esc(b.name || prettyKind(b.kind))}</h2>` +
        `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
      card.style.display = 'block';
      if (fly) {
        const pts = b.outlines.flat();
        const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
        const pad = 250;
        const r = viewer.viewport.imageToViewportRectangle(Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) - Math.min(...xs) + 2 * pad, Math.max(...ys) - Math.min(...ys) + 2 * pad);
        viewer.viewport.fitBounds(r);
      }
    }

    // ---- search ----
    const named = meta.buildings.filter((b) => b.name || b.ref);
    const search = document.getElementById('search'), results = document.getElementById('results');
    let hits = [], active = 0;
    function renderResults() {
      results.innerHTML = hits.map((b, i) => `<li class="${i === active ? 'active' : ''}" data-i="${i}">${label(b)}</li>`).join('');
    }
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      active = 0;
      const seen = new Set();
      hits = !q ? [] : named
        .map((b) => ({ b, s: (b.ref || '').toLowerCase() === q ? 0 : (b.ref || '').toLowerCase().startsWith(q) ? 1 : (b.name || '').toLowerCase().includes(q) ? 2 : 9 }))
        .filter((x) => x.s < 9).sort((a, b) => a.s - b.s)
        .map((x) => x.b).filter((b) => { const k = b.ref || b.name; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8);
      renderResults();
    });
    search.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { active = Math.min(active + 1, hits.length - 1); renderResults(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderResults(); e.preventDefault(); }
      if (e.key === 'Enter' && hits[active]) { select(hits[active], true); hits = []; renderResults(); search.blur(); }
      if (e.key === 'Escape') { hits = []; renderResults(); search.blur(); }
    });
    results.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (li) { select(hits[+li.dataset.i], true); hits = []; renderResults(); }
    });
  })();
  </script>
</body>
</html>
