<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Isometric UWaterloo</title>
  <meta name="description" content="A giant isometric map of the University of Waterloo. Every building is real: point at one to see what it is.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3eee4; --ink: #1f1c17; --muted: #6d6658; --gold: #fed34c; --gold-deep: #c99a06;
      --glass: rgba(255, 252, 245, .42); --glass-strong: rgba(255, 252, 245, .62); --edge: rgba(255, 255, 255, .7);
      --shadow: 0 10px 34px rgba(70, 55, 25, .18), 0 1px 3px rgba(70, 55, 25, .12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
    #map { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #hl, #veh { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; } /* canvases do not stretch with inset alone */
    #vcards { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    /* little glass tags that ride along with buses and trains */
    .chip.vcard {
      top: 0; left: 0; display: flex; align-items: center; gap: 7px; padding: 4px 9px 4px 4px; border-radius: 11px;
      white-space: nowrap; pointer-events: none; will-change: transform; transition: opacity .25s;
      -webkit-backdrop-filter: blur(12px) saturate(170%); backdrop-filter: blur(12px) saturate(170%);
      box-shadow: 0 4px 14px rgba(70, 55, 25, .18), inset 0 1px 0 rgba(255, 255, 255, .9);
    }
    .vcard::after {
      content: ''; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg);
      background: var(--glass-strong); border-right: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    }
    .vcard .rb { flex: none; min-width: 26px; padding: 0 5px; border-radius: 7px; color: #fff; text-align: center; font: 10px/19px Silkscreen, monospace; letter-spacing: .2px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
    .vcard .lg { height: 15px; width: auto; flex: none; margin-left: 3px; }
    .vcard .vt { display: flex; flex-direction: column; line-height: 1.15; }
    .vcard b { font-size: 11.5px; font-weight: 600; }
    .vcard small { font-size: 10.5px; color: var(--muted); }
    .chip.vcard.compact { padding: 3px; border-radius: 9px; }
    .vcard.lifted::after { display: none; }
    .vcard.compact .vt { display: none; }
    .vcard.behind { opacity: .55; }
    /* liquid glass: heavy blur + saturation, bright rim, soft inner highlight */
    .chip {
      position: fixed; background: linear-gradient(135deg, var(--glass-strong), var(--glass));
      border: 1px solid var(--edge); border-radius: 18px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .9), inset 0 -1px 0 rgba(120, 100, 60, .08);
      -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    }
    #title { top: 16px; left: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; width: 320px; max-width: calc(100vw - 32px); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: 44px; object-fit: contain; flex: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .15)); }
    .brand h1 { margin: 0; font: 17px/1.15 Silkscreen, monospace; letter-spacing: .3px; color: var(--ink); }
    .brand h1 span { color: var(--gold-deep); }
    .brand a { display: inline-block; margin-top: 3px; color: var(--muted); font-size: 12px; text-decoration: none; }
    .brand a:hover { color: var(--ink); }
    .brand a b { font-weight: 600; color: var(--ink); border-bottom: 1.5px solid var(--gold); }
    .searchbox { position: relative; }
    .searchbox svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
    #search {
      width: 100%; padding: 9px 12px 9px 33px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .8);
      background: rgba(255, 255, 255, .55); color: var(--ink); font: inherit; outline: none;
      box-shadow: inset 0 1px 2px rgba(70, 55, 25, .08);
    }
    #search::placeholder { color: #8b8474; }
    #search:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(254, 211, 76, .35); }
    #results { list-style: none; margin: -4px 0 0; padding: 0; max-height: 40vh; overflow: auto; }
    #results:empty { display: none; }
    #results li { padding: 6px 8px; border-radius: 9px; cursor: pointer; }
    #results li:hover, #results li.active { background: rgba(255, 255, 255, .6); }
    .code { display: inline-block; padding: 0 6px; margin-right: 7px; border-radius: 6px; background: var(--gold); color: #1f1c17; font: 11px/18px Silkscreen, monospace; vertical-align: 1px; }
    #tip { position: fixed; pointer-events: none; padding: 6px 10px; font-size: 13px; display: none; white-space: nowrap; z-index: 5; border-radius: 12px; }
    #card { right: 16px; bottom: 40px; width: 300px; max-width: calc(100vw - 32px); padding: 16px 18px; display: none; }
    #card h2 { margin: 6px 0 2px; font-size: 16px; }
    #card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0 0; font-size: 13px; }
    #card dt { color: var(--muted); }
    #card dd { margin: 0; }
    #card a { color: var(--ink); text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
    #card .x { position: absolute; top: 8px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
    #credit { right: 16px; bottom: 10px; padding: 3px 10px; font-size: 11px; color: var(--muted); border-radius: 8px; }
    #credit a { color: var(--muted); }
    #feedback { left: 16px; bottom: 10px; padding: 7px 13px; border-radius: 12px; color: var(--ink); font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 7px; }
    #feedback:hover { background: rgba(255, 255, 255, .7); }
    #feedback svg { width: 15px; height: 15px; color: var(--gold-deep); }
    @media (max-width: 600px) { #card { left: 16px; right: 16px; width: auto; bottom: 56px; } #credit { left: auto; max-width: calc(100vw - 170px); } #title { width: auto; right: 16px; } }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="veh"></canvas>
  <div id="vcards"></div>
  <canvas id="hl"></canvas>
  <div id="title" class="chip">
    <div class="brand">
      <img src="uwaterloo-logo.png" alt="University of Waterloo" onerror="this.remove()">
      <div>
        <h1>Isometric <span>UWaterloo</span></h1>
        <a id="author" href="https://www.linkedin.com/in/ayaanfaisal18/" target="_blank" rel="noopener">Built by <b>Ayaan</b> ↗</a>
      </div>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Find a building or lot (DC, SLC, Lot C…)" autocomplete="off" aria-label="Find a building">
    </div>
    <ul id="results"></ul>
  </div>
  <div id="tip" class="chip"></div>
  <div id="card" class="chip"><button class="x" aria-label="Close">×</button><div id="cardBody"></div></div>
  <a id="feedback" class="chip" href="mailto:a34faisa@uwaterloo.ca?subject=Isometric%20UWaterloo%20feedback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Give feedback</a>
  <div id="credit" class="chip">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> · <a href="sprites/CREDITS.md" target="_blank" rel="noopener">Vehicle photos</a></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
  <script src="traffic.js"></script>
  <script>
  (async () => {
    const OUT = new URL('../out/', location.href).href;
    const exists = async (u) => { try { return (await fetch(u, { method: 'HEAD' })).ok; } catch { return false; } };
    const meta = await (await fetch(OUT + 'meta.json')).json();
    const life = await fetch(OUT + 'traffic.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    // One layer: the AI-painted map, falling back to the OSM whitebox if it hasn't been painted yet.
    const layer = (await exists(OUT + 'map.png'))
      ? { file: 'map.png', credit: 'Painted from imagery © Google' }
      : { file: 'render.png' };

    const viewer = OpenSeadragon({
      element: document.getElementById('map'),
      tileSources: { type: 'image', url: OUT + layer.file },
      showNavigationControl: false, imageSmoothingEnabled: false,
      maxZoomPixelRatio: 2, visibilityRatio: 0.6, constrainDuringPan: true,
      gestureSettingsMouse: { clickToZoom: false },
      animationTime: 0.6, springStiffness: 9,
    });
    window.viewer = viewer;
    viewer.addHandler('open-failed', (e) => console.error('open failed', e.message));
    document.body.style.background = meta.background;
    if (layer.credit) document.getElementById('credit').innerHTML += ` · ${layer.credit}`;

    // ---- building lookup via the ID map ----
    const byId = new Map(meta.buildings.map((b) => [b.id, b]));
    const idImg = new Image();
    idImg.src = OUT + 'idmap.png';
    await idImg.decode();
    const idc = document.createElement('canvas');
    idc.width = idImg.width; idc.height = idImg.height;
    const ictx = idc.getContext('2d', { willReadFrequently: true });
    ictx.drawImage(idImg, 0, 0);
    const idData = ictx.getImageData(0, 0, idc.width, idc.height).data;
    const D = meta.idDownsample;
    function buildingAt(ix, iy) {
      const x = Math.floor(ix / D), y = Math.floor(iy / D);
      if (x < 0 || y < 0 || x >= idc.width || y >= idc.height) return null;
      const i = (y * idc.width + x) * 4;
      if (idData[i + 2] < 128) return null;
      return byId.get(idData[i] + idData[i + 1] * 256) || null;
    }

    // ---- simulated life: traffic, ION + crossings, students, geese, parking labels ----
    const occluded = (ix, iy) => {
      const x = Math.floor(ix / D), y = Math.floor(iy / D);
      return x >= 0 && y >= 0 && x < idc.width && y < idc.height && idData[(y * idc.width + x) * 4 + 2] >= 128;
    };
    if (life) {
      try { startTraffic({ viewer, data: life, occluded, canvas: document.getElementById('veh'), cardLayer: document.getElementById('vcards') }); }
      catch (e) { console.warn('traffic disabled:', e); }
    }

    // ---- named parking lots: hover/select them like buildings (ground-level outlines) ----
    const lots = (life?.parking || []).map((l) => ({ ...l, kind: 'parking', ref: null, outlines: [l.outline] }));
    const inRing = (x, y, r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [xi, yi] = r[i], [xj, yj] = r[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
    const lotAt = (ix, iy) => lots.find((l) => inRing(ix, iy, l.outline)) || null;
    const thingAt = (ix, iy) => buildingAt(ix, iy) || lotAt(ix, iy);

    // ---- highlight overlay ----
    const hl = document.getElementById('hl');
    const hctx = hl.getContext('2d');
    let hover = null, selected = null;
    function draw() {
      const dpr = devicePixelRatio || 1;
      if (hl.width !== innerWidth * dpr || hl.height !== innerHeight * dpr) { hl.width = innerWidth * dpr; hl.height = innerHeight * dpr; }
      hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      hctx.clearRect(0, 0, innerWidth, innerHeight);
      const item = viewer.world.getItemAt(0);
      if (!item) return;
      const px = ([x, y]) => item.imageToViewerElementCoordinates(new OpenSeadragon.Point(x, y));
      for (const [b, style] of [[selected, '#fed34c'], [hover !== selected ? hover : null, '#ffffffcc']]) {
        if (!b) continue;
        hctx.beginPath();
        for (const poly of b.outlines) {
          poly.forEach((pt, i) => { const p = px(pt); i ? hctx.lineTo(p.x, p.y) : hctx.moveTo(p.x, p.y); });
          hctx.closePath();
        }
        hctx.lineJoin = 'round';
        hctx.lineWidth = 2; hctx.strokeStyle = style; hctx.fillStyle = style.slice(0, 7) + '22';
        hctx.fill('evenodd'); hctx.stroke();
      }
    }
    viewer.addHandler('animation', draw);
    viewer.addHandler('update-viewport', draw);
    addEventListener('resize', draw);

    const label = (b) => (b.ref ? `<span class="code">${esc(b.ref)}</span>` : '') + esc(b.name || prettyKind(b.kind));
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const prettyKind = (k) => ({ yes: 'Building', university: 'University building', dormitory: 'Residence', apartments: 'Apartments', house: 'House', retail: 'Shop', part: 'Building', parking: 'Parking lot' }[k] || (k ? k[0].toUpperCase() + k.slice(1).replace(/_/g, ' ') : 'Building'));

    const tip = document.getElementById('tip');
    new OpenSeadragon.MouseTracker({
      element: viewer.canvas,
      moveHandler: (e) => {
        const item = viewer.world.getItemAt(0);
        if (!item) return;
        const ip = item.viewerElementToImageCoordinates(e.position);
        const b = thingAt(ip.x, ip.y);
        if (b !== hover) { hover = b; draw(); }
        viewer.canvas.style.cursor = b ? 'pointer' : '';
        if (b && e.pointerType === 'mouse') {
          tip.innerHTML = label(b);
          tip.style.display = 'block';
          tip.style.left = Math.min(e.originalEvent.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
          tip.style.top = e.originalEvent.clientY + 14 + 'px';
        } else tip.style.display = 'none';
      },
      leaveHandler: () => { hover = null; tip.style.display = 'none'; draw(); },
    });
    viewer.addHandler('canvas-click', (e) => {
      if (!e.quick) return;
      const item = viewer.world.getItemAt(0);
      const ip = item.viewerElementToImageCoordinates(e.position);
      select(thingAt(ip.x, ip.y), false);
    });

    const card = document.getElementById('card');
    card.querySelector('.x').onclick = () => select(null);
    function select(b, fly) {
      selected = b;
      draw();
      if (!b) { card.style.display = 'none'; return; }
      const rows = [
        ['Type', prettyKind(b.kind)],
        b.levels ? ['Storeys', b.levels] : null,
        b.kind === 'parking' ? (b.access ? ['Access', esc(b.access)] : null) : ['Height', `~${Math.round(b.height)} m`],
        b.kind === 'parking' && b.area ? ['Size', `~${Math.round(b.area / 100) * 100} m²`] : null,
        b.address ? ['Address', esc(b.address)] : null,
        b.operator ? ['Operator', esc(b.operator)] : null,
        b.osm ? ['Source', `<a href="https://www.openstreetmap.org/${b.osm}" target="_blank" rel="noopener">OpenStreetMap</a>`] : null,
      ].filter(Boolean);
      document.getElementById('cardBody').innerHTML =
        (b.ref ? `<span class="code">${esc(b.ref)}</span>` : '') + `<h2>${esc(b.name || prettyKind(b.kind))}</h2>` +
        `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
      card.style.display = 'block';
      if (fly) {
        const pts = b.outlines.flat();
        const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
        const pad = 250;
        const r = viewer.viewport.imageToViewportRectangle(Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) - Math.min(...xs) + 2 * pad, Math.max(...ys) - Math.min(...ys) + 2 * pad);
        viewer.viewport.fitBounds(r);
      }
    }

    // ---- search ----
    const named = [...meta.buildings.filter((b) => b.name || b.ref), ...lots];
    const search = document.getElementById('search'), results = document.getElementById('results');
    let hits = [], active = 0;
    function renderResults() {
      results.innerHTML = hits.map((b, i) => `<li class="${i === active ? 'active' : ''}" data-i="${i}">${label(b)}</li>`).join('');
    }
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      active = 0;
      const seen = new Set();
      hits = !q ? [] : named
        .map((b) => ({ b, s: (b.ref || '').toLowerCase() === q ? 0 : (b.ref || '').toLowerCase().startsWith(q) ? 1 : (b.name || '').toLowerCase().includes(q) ? 2 : 9 }))
        .filter((x) => x.s < 9).sort((a, b) => a.s - b.s)
        .map((x) => x.b).filter((b) => { const k = b.ref || b.name; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8);
      renderResults();
    });
    search.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { active = Math.min(active + 1, hits.length - 1); renderResults(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderResults(); e.preventDefault(); }
      if (e.key === 'Enter' && hits[active]) { select(hits[active], true); hits = []; renderResults(); search.blur(); }
      if (e.key === 'Escape') { hits = []; renderResults(); search.blur(); }
    });
    results.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (li) { select(hits[+li.dataset.i], true); hits = []; renderResults(); }
    });
  })();
  </script>
</body>
</html>
